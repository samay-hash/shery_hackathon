version: '3.8'

services:
  # Backend
  backend:
    build: ./backend
    container_name: deployx-backend
    ports:
      - "3001:3001"
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-builds:/tmp/deployx-builds
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - deployx-net

  # Redis for BullMQ Queue
  redis:
    image: redis:alpine
    container_name: deployx-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - deployx-net

  # Frontend
  frontend:
    build: ./frontend
    container_name: deployx-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - deployx-net

volumes:
  backend-builds:

networks:
  deployx-net:
    driver: bridge
