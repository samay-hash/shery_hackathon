version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: deployx-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - deployx-net

  # Backend
  backend:
    build: ./backend
    container_name: deployx-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/deployx
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET:-deployx_secret_2026}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - deployx-net

  # Frontend
  frontend:
    build: ./frontend
    container_name: deployx-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - VITE_SOCKET_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - deployx-net

volumes:
  mongo-data:

networks:
  deployx-net:
    driver: bridge
